name: build

# Manual trigger only: neither push nor pull_request runs this automatically.
# Click "Run workflow" on the Actions page, or use `gh workflow run build.yml`.
# Note: workflow_dispatch requires this file to exist on the repo's default
# branch, otherwise the button won't appear.
on:
  workflow_dispatch:

jobs:
  # Host unit tests. No ESP-IDF dependency, finishes in about 5 seconds.
  # If you only want the firmware, remove this job and the `needs` line on
  # the firmware job below.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host unit tests
        run: ./test/run.sh

  firmware:
    runs-on: ubuntu-latest
    needs: host-tests
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4

      # The container's uid doesn't match the checked-out files' owner, so
      # git calls made during the IDF build to fetch the version number
      # fail with "dubious ownership".
      - name: Allow git directory ownership check
        run: git config --global --add safe.directory '*'

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Collect flashing artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/dual_beacon.bin                   artifacts/
          cp build/bootloader/bootloader.bin         artifacts/
          cp build/partition_table/partition-table.bin artifacts/
          ls -l artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: dual-beacon-firmware
          path: artifacts/
          if-no-files-found: error
